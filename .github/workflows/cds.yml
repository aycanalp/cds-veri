name: Turkiye CDS toplayici

on:
  workflow_dispatch:
  schedule:
    # Hafta ici her 2 saatte bir: 08:41 - 22:41 Istanbul (05:41 - 19:41 UTC).
    # investing.com bazi GitHub sunucularini engelliyor; sik deneme bir tanesinin basarili olmasini saglar.
    - cron: "41 5-19/2 * * 1-5"

permissions:
  contents: write

concurrency:
  group: cds-toplayici
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneler
        run: pip install requests curl_cffi

      - name: CDS oku
        run: python collect.py

      - name: Kaydet
        if: always()
        run: |
          git config user.name "CDS toplayici"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "CDS verisi $(date -u +%Y-%m-%d_%H:%M)" && git pull --rebase && git push)
